name: release

# Tag a release to publish: git tag v0.1.0-preview.1 && git push origin v0.1.0-preview.1
# The tag drives the package version, so the four packages always ship as a matched set.
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        run: echo "PKG_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: dotnet restore AdaptiveLighting.slnx
      - run: dotnet build AdaptiveLighting.slnx -c Release --no-restore -p:Version=$PKG_VERSION
      - run: dotnet test AdaptiveLighting.slnx -c Release --no-build

      - run: dotnet pack AdaptiveLighting.slnx -c Release --no-build -p:Version=$PKG_VERSION -o artifacts

      # GitHub Packages, not nuget.org, matching ESPHomeAdmin.
      #
      # A fine-grained PAT, not the per-run GITHUB_TOKEN. GITHUB_TOKEN is scoped to this repository, which is
      # enough to publish and not enough to be the one credential a consumer also restores with — the houses
      # pull this package from another repository entirely. One token, both directions, and its scope is
      # visible and revocable in one place.
      #
      # PACKAGES_TOKEN must be a fine-grained personal access token, resource owner 0z00z0, with:
      #   Repository permissions -> Contents: Read-only          (restore during the build)
      #   Account/Org permissions -> Packages: Read and write     (the push below)
      # Add it under Settings -> Secrets and variables -> Actions. A classic token with write:packages also
      # works; fine-grained is preferred because the scope is per-resource and it can be given an expiry.
      #
      # The trade-off, stated because it is real: GitHub's NuGet feed authenticates every read, including a
      # public package from an MIT repo, so an outside consumer needs a token of their own. Moving to
      # nuget.org later is a source change and a version bump, not a migration.
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.PACKAGES_TOKEN }}" --source https://nuget.pkg.github.com/0z00z0/index.json --skip-duplicate
