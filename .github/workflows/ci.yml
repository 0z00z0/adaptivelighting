name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AdaptiveLighting.slnx
      - run: dotnet build AdaptiveLighting.slnx -c Release --no-restore
      - run: dotnet test AdaptiveLighting.slnx -c Release --no-build --verbosity normal
